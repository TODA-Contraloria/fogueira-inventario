<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fogueira">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Fogueira Inventario</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #C9A961;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 16px;
            letter-spacing: 2px;
        }
        p {
            font-size: 18px;
            margin-bottom: 24px;
            opacity: 0.8;
        }
        .status {
            background: #1a1a1a;
            border: 1px solid #C9A961;
            padding: 16px 24px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .ok { color: #4ade80; }
    </style>
</head>
<body>
    <h1>FOGUEIRA</h1>
    <p>Inventario Ciego — PWA v0.1</p>
    <div class="status">
        <p class="ok">✓ App cargada correctamente</p>
        <p id="online">Verificando conexión...</p>
    </div>

    <script>
        function updateStatus() {
            const el = document.getElementById('online');
            if (navigator.onLine) {
                el.textContent = '🟢 Conectado';
                el.style.color = '#4ade80';
            } else {
                el.textContent = '🔴 Sin conexión (modo offline)';
                el.style.color = '#fbbf24';
            }
        }
        updateStatus();
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('SW registrado'))
                .catch(err => console.log('SW error:', err));
        }
    </script>
</body>
</html>
